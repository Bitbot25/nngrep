[package]
name = "nngrep"
version = "0.1.0"
edition = "2024"
description = "Semantic grep using Qwen3-Embedding-4B"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = { version = "2", features = ["std"] }
ignore = "0.4"
indicatif = "0.17"
rayon = "1"
rust-stemmers = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["vulkan"] }

[profile.release]
lto = "thin"
