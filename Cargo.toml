[package]
name = "nngrep"
version = "0.1.0"
edition = "2024"
description = "Semantic grep using Qwen3-Embedding-4B"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = { version = "2", features = ["std"] }
ignore = "0.4"
indicatif = "0.17"
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = "thin"
